
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Our Photo Booth</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fceef4;
      padding: 25px;
      color: #333;
    }

    h1 { color: #d45b8c; }

    button {
      background: #d45b8c;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      background: #333;
    }

    #preview img {
      width: 100px;
      margin: 5px;
      border-radius: 8px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📸 Our Photo Booth</h1>
  <p>Take some pictures and share your memories!</p>

  <p id="count">0 / 10 photos</p>

  <video id="camera" autoplay playsinline muted></video>

  <br>

  <button id="openBtn" onclick="startCamera()">
    Open Camera
  </button>

  <button id="takeBtn" onclick="takePhoto()">
    Take Photo
  </button>

  <div id="preview"></div>

  <br>

  <p>
    When you submit, your photos will be uploaded
    to the event organizer's Google Drive.
  </p>

  <button id="submitBtn" onclick="submitPhotos()">
    Submit Photos
  </button>

  <p id="message"></p>

  <canvas id="canvas" hidden></canvas>

  <iframe
    name="uploadFrame"
    id="uploadFrame"
    hidden>
  </iframe>

  <form
    id="uploadForm"
    method="POST"
    target="uploadFrame"
    action="https://script.google.com/macros/s/AKfycbzk36H7mbqC28rX-JrMBIHnoKB8zmNmW0riQgnT1YOQqnlWzD9PU4295ePKXmIGyo2J1g/exec">

    <input type="hidden" name="payload" id="payload">
  </form>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");

    let photos = [];
    let uploading = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        document.getElementById("message").textContent =
          "Camera ready! 📸";

      } catch (error) {
        document.getElementById("message").textContent =
          "Camera unavailable. Please check your browser permissions.";
      }
    }

    function takePhoto() {
      if (!video.srcObject || video.readyState < 2) {
        alert("Please open the camera first!");
        return;
      }

      if (photos.length >= 10) {
        alert("Maximum 10 photos!");
        return;
      }

      const scale = Math.min(
        1,
        1600 / video.videoWidth,
        1600 / video.videoHeight
      );

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      canvas.getContext("2d").drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data = canvas.toDataURL("image/jpeg", 0.72);

      photos.push({
        name: "Photo_" + (photos.length + 1) + ".jpg",
        mimeType: "image/jpeg",
        data: data.split(",")[1]
      });

      const img = document.createElement("img");
      img.src = data;
      img.alt = "Photo preview";

      preview.appendChild(img);

      document.getElementById("count").textContent =
        photos.length + " / 10 photos";
    }

    function submitPhotos() {
      if (photos.length === 0) {
        alert("Take at least one photo first!");
        return;
      }

      if (uploading) return;

      uploading = true;

      document.getElementById("submitBtn").disabled = true;

      document.getElementById("message").textContent =
        "Uploading photos... Please wait.";

      document.getElementById("payload").value =
        JSON.stringify({ photos: photos });

      document.getElementById("uploadForm").submit();
    }

    window.addEventListener("message", function(event) {
      if (event.source !== document.getElementById("uploadFrame").contentWindow) {
        return;
      }

      if (event.data === "UPLOAD_SUCCESS") {
        document.getElementById("message").textContent =
          "Photos uploaded successfully! ❤️";

        photos = [];
        preview.innerHTML = "";

        document.getElementById("count").textContent =
          "0 / 10 photos";

        uploading = false;
        document.getElementById("submitBtn").disabled = false;
      }

      if (typeof event.data === "string" &&
          event.data.startsWith("UPLOAD_ERROR:")) {

        document.getElementById("message").textContent =
          "Upload failed. Please try again.";

        uploading = false;
        document.getElementById("submitBtn").disabled = false;
      }
    });
  </script>

</body>
</html>
